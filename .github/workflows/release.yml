name: Release

# Publishes the files in downloads/ as a GitHub release.
#   Actions > Release > Run workflow (tag defaults to v1.3.0)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v1.3.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify checksums
        working-directory: downloads
        run: sha256sum -c SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cat > notes.md <<'NOTES'
          Ready-to-install builds of **VTLO 3O3**, a standalone offline studio on one transport and one tempo: two TB-303 bass lines, a **WOBBLE** synth (round waves and a tempo-synced filter LFO), a 606/808/909 drum machine, a second drum machine with sample-pack kits (frenchcore, hardtek, drum and bass, bass hits), a sampler, six tempo-syncable master effects (beat repeat, flanger, chorus, warble, vowel, ghost) and a 16-pad deck per instrument that records 8 or 16 bar loops.

          Two built-in **live sets** with eight scenes each, played from the SET / LIVE control: UK Drum & Bass (170 BPM, F minor) and Hardtekno Tribe (155 BPM, A minor). Drum kits are levelled so a groove plus a bass line no longer hits the limiter.

          | Platform | File |
          |---|---|
          | Android 8.0+ | `VTLO-3O3-android.apk` |
          | Windows 10/11 x64 installer | `VTLO-3O3-Setup-windows-x64.exe` |
          | Linux, Debian/Ubuntu | `vtlo-3o3_1.3.0_amd64.deb` (`sudo apt install ./vtlo-3o3_1.3.0_amd64.deb`) |
          | Linux, any distribution | `VTLO-3O3-linux-x64.tar.gz` (unpack and run) |
          | Browser version, Windows and Linux | `VTLO-303-web-windows-linux.zip` (run the launcher inside) |

          The desktop builds include their own Java runtime. The APK is signed with a debug key, so Android may ask you to allow installs from this source. Checksums are in `SHA256SUMS`.
          NOTES
          sed -i 's/^          //' notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running for an existing tag refreshes the notes and the files.
            gh release edit "$TAG" --title "VTLO 3O3 ${TAG#v}" --notes-file notes.md
            gh release upload "$TAG" downloads/* --clobber
          else
            gh release create "$TAG" downloads/* \
              --target main \
              --title "VTLO 3O3 ${TAG#v}" \
              --notes-file notes.md
          fi
